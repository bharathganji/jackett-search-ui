name: Auto Release

on:
  push:
    branches:
      - main

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Git user
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: |
        npm run lint
        npx tsc --noEmit
        npm run format:check
        
    - name: Determine version bump
      id: version_bump
      run: |
        # Get the latest tag or set to 0.0 if none exists
        if git describe --tags --abbrev=0 >/dev/null 2>&1; then
          LATEST_TAG=$(git describe --tags --abbrev=0)
        else
          LATEST_TAG="v0.0.0"
        fi
        
        echo "Latest tag: $LATEST_TAG"
        
        # Analyze commits since last tag to determine version bump
        if git log --oneline $LATEST_TAG..HEAD | grep -q "feat:"; then
          BUMP="minor"
        elif git log --oneline $LATEST_TAG..HEAD | grep -q "fix:"; then
          BUMP="patch"
        elif git log --oneline $LATEST_TAG..HEAD | grep -q "perf:"; then
          BUMP="patch"
        else
          BUMP="patch"  # Default to patch if no conventional commits found
        fi
        
        echo "Bump type: $BUMP"
        echo "bump=$BUMP" >> $GITHUB_OUTPUT
        
    - name: Create release
      run: |
        # Create new version and tag
        npm run release:${{ steps.version_bump.outputs.bump }}
        
    - name: Push changes
      run: |
        git push --follow-tags origin main
        
    - name: Wait for release workflow
      run: |
        echo "Waiting for release workflow to complete..."
        sleep 10